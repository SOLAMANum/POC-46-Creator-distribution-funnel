# ============================================================
# POC 46 Creator Distribution Funnel — Docker Compose Stack
# Usage:
#   cp .env.example .env       # fill in your real values
#   docker compose up --build  # spin up both services
# ============================================================

services:

  # ──────────────────────────────────────────────
  # FastAPI Backend  →  http://localhost:5000
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runner
    container_name: poc46-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/data')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────
  # Next.js Frontend  →  http://localhost:3000
  # NOTE: NEXT_PUBLIC_* vars are baked into the
  # bundle at BUILD TIME — update args & rebuild
  # if you change the backend URL.
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
      args:
        # These build args inject NEXT_PUBLIC_ values into the JS bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    container_name: poc46-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
